<!DOCTYPE html>
<html>
<head>
    <title>AI Trip Planner</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, sans-serif;
        }

        #bg-video{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:-1;
        }

        .trip-container{
            width:420px;
            padding:30px;

            background:rgba(255,255,255,0.12);

            backdrop-filter:blur(15px);
            -webkit-backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,0.2);

            border-radius:20px;

            color:white;

            box-shadow:0 8px 32px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            height:45px;

            padding:10px;

            margin-bottom:12px;

            border:none;

            border-radius:10px;

            font-size:15px;
        }

        button{
            width:100%;
            height:45px;

            border:none;

            border-radius:10px;

            background:#007bff;

            color:white;

            cursor:pointer;
        }

        button:hover{
            opacity:0.9;
        }

    </style>

</head>

<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="{{ url_for('static', filename='background.mp4') }}" type="video/mp4">
    </video>

    <div class="trip-container">

        <h1>AI Trip Planner</h1>

        <form action="/generate-trip" method="POST">

            <input type="text" name="source" placeholder="Source City" required>

            <input type="text" name="destination" placeholder="Destination" required>

            <input type="number" name="budget" placeholder="Budget" required>

            <input type="number" name="days" placeholder="Number of Days" required>

            <button type="submit">
                Generate Trip Plan
            </button>

        </form>

    </div>

</body>
</html>
