<!DOCTYPE html>
<html>
<head>
    <title>AI Trip Plan</title>

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:Arial,sans-serif;
        color:white;
    }

    #bg-video{
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        object-fit:cover;
        z-index:-1;
    }

    .container{
        width:80%;
        max-width:900px;

        margin:50px auto;

        background:rgba(255,255,255,0.12);

        backdrop-filter:blur(15px);
        -webkit-backdrop-filter:blur(15px);

        border:1px solid rgba(255,255,255,0.2);

        border-radius:20px;

        padding:30px;

        box-shadow:0 8px 32px rgba(0,0,0,0.3);
    }

    h1{
        text-align:center;
        margin-bottom:20px;
    }

    pre{
        white-space:pre-wrap;
        line-height:1.7;
        font-size:16px;
    }

    .btn{
        display:block;
        width:220px;
        text-align:center;
        margin:25px auto 0;
        padding:12px;

        background:#007bff;
        color:white;

        text-decoration:none;

        border-radius:10px;
    }

    </style>

</head>

<body>

<video autoplay muted loop playsinline id="bg-video">
    <source src="{{ url_for('static', filename='background.mp4') }}" type="video/mp4">
</video>

<div class="container">

    <h1>✈ AI Travel Plan</h1>

    <pre>{{ result }}</pre>

    <a href="/trip-planner" class="btn">
        Create Another Plan
    </a>

</div>

</body>
</html>
